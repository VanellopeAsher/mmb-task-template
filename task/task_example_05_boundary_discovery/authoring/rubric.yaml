version: 6
artifact: /workspace/results/answer.json
reward:
  pass: 1
  fail: 0
  rule: All three comparisons must report supported directions or the correct insufficiency status for every film condition.
reference:
  input: environment/data/observations.csv
  independent_calculation: authoring/evidence/independent_reference.py
  accepted_windows: tests/condition_context.json
