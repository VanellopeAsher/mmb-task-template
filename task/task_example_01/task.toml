schema_version = "1.0"

# Transfer ordinary workspace results and Harbor's agent log for format-free answers.
artifacts = ["/workspace/results/", "/logs/agent/"]

[task]
name = "mattermysterybench/task_example_01"
description = "Investigate nonsymmorphic phonon-scattering constraints and their relation to lattice thermal transport across crystalline materials."
authors = []
keywords = ["phonons", "nonsymmorphic-symmetry", "selection-rules", "thermal-transport"]

[metadata]
task_id = "example_01"
domain = "physical-sciences"
field = "materials-science"
subfield = "lattice-dynamics"
tags = ["phonons", "crystallography", "thermal-conductivity"]

[metadata.human_baseline]
expert_count = 5
time_limit_hours = 8
environment_path = "environment/"
human_hard_rule = "all_five_experts_unsolved"

[metadata.harbor.lint]
# Final-answer grading deliberately transfers Harbor's agent log to the separate verifier.
ignore = ["artifact-log-overlap"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 32768
storage_mb = 20480
gpus = 0
network_mode = "public"
