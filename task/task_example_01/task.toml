schema_version = "1.0"

# Transfer the declared answer artifact to the isolated verifier.
artifacts = ["/workspace/results/"]

[task]
name = "mattermysterybench/task_example_01"
description = "Test whether a phonon gap criterion predicts three- versus four-phonon scattering in a BAs force model."
authors = []
keywords = ["phonons", "selection-rules", "four-phonon-scattering", "thermal-transport"]

[metadata]
task_id = "example_01"
domain = "physical-sciences"
field = "materials-science"
subfield = "lattice-dynamics"
tags = ["phonons", "lattice-dynamics", "anharmonic-transport"]

[metadata.human_baseline]
expert_count = 5
time_limit_hours = 8
environment_path = "environment/"
human_hard_rule = "all_five_experts_unsolved"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 32768
storage_mb = 20480
gpus = 0
network_mode = "public"
