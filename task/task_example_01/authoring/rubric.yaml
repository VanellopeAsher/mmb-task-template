# Author-side scoring contract for the data-dependent interaction task.
version: 2
artifact: /workspace/results/answer.json
reward:
  pass: 1
  fail: 0
  rule: All 15 numerical values in interaction_checks must pass.
materials: [GaN, AlN, ZnS]
triplets:
  normal: [[0, 0, 1], [0, 0, 1], [0, 0, -2]]
  odd_umklapp: [[0, 0, 2], [0, 0, 2], [0, 0, 2]]
per_triplet:
  largest_sector_share:
    absolute_tolerance: 0.0002
    source: Reconstructed three-phonon strengths grouped in the screw eigenbasis.
  effective_sector_count:
    absolute_tolerance: 0.05
    source: Inverse sum of squared shares of allowed screw-label sectors.
per_material:
  odd_normal_total_ratio:
    absolute_tolerance: 0.0002
    source: Ratio of total allowed interaction strengths for the two specified triplets.
unscored_optional: [analysis]
excluded_shortcuts: [selection_rule, ratio_300K, all_wurtzite_higher]
reference_crosscheck: authoring/evidence/check_witness.py
