version: 1
artifact: /workspace/results/answer.json
reward:
  range: [0, 1]
  rule: Equal weights for measured recovery and matched XPS contrasts, discounted by prediction error under the stated budget.
scored_outputs:
  - name: experiments
    units: fractional loss or recovery
    reference_source: Published source workbook, Supplementary Figure 3 and Figure 3f.
    tolerance: Full prediction credit within 0.05 absolute error, zero from 0.25.
unscored_optional: [analysis]
