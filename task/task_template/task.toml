# Harbor task configuration. Replace these example limits with measured values.
schema_version = "1.0"
artifacts = ["/workspace/results/"]

[task]
name = "mattermysterybench/task_REPLACE_WITH_UNIQUE_TASK_ID"
description = "REPLACE_WITH_SCIENTIFIC_QUESTION_SUMMARY"
authors = []
keywords = []

[metadata]
task_id = "REPLACE_WITH_UNIQUE_TASK_ID" # MMB catalog identifier; match directory name.
domain = "REPLACE_WITH_SCIENTIFIC_DOMAIN"
field = "REPLACE_WITH_FIELD"
subfield = "REPLACE_WITH_SUBFIELD"
tags = []

# Human baseline protocol. Set the per-task limit before recruiting experts.
[metadata.human_baseline]
expert_count = 5
time_limit_hours = 8
environment_path = "environment/"
human_hard_rule = "all_five_experts_unsolved"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "none" # Review task needs and Harbor version before changing.
