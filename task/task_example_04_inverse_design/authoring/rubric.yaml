version: 1
artifact: /workspace/results/answer.json
reward:
  pass: 1
  fail: 0
  rule: Select the unique candidate meeting all five process-level constraints and report its source KPI values within tolerance.
scored_outputs:
  - name: selected_candidate
    units: MOF identifier
    tolerance: exact
    reference_source: CoRE MOF TSA process trajectories, independently reconciled with Table 1, Granderath et al. 2026.
    shortcut_audit: Current Agent-visible five-row table exposes the choice by direct filtering; not eligible as a discovery challenge.
  - name: process_kpis
    units: mixed (dimensionless, mol kg-1, MJ mol-1)
    tolerance: Published rounding intervals, half-width 0.005 for purity/recovery/capacity and 0.0005 for energy.
    reference_source: Recomputed process trajectory mass balance, checked against source evaluations.
    shortcut_audit: Objective numeric check, but source table is visible to the Agent.
  - name: enrichment
    units: dimensionless
    tolerance: Published rounding interval, half-width 0.005.
    reference_source: Recomputed methane product purity divided by feed mole fraction at 0.5 and 0.003.
    shortcut_audit: Both feed values are visible in the current five-row table.
unscored_optional: [analysis]
