name: Validate example_01 phonon evidence

on:
  push:
    paths:
      - "task/task_example_01/**"
      - "scripts/build_harbor_task.py"
      - ".github/workflows/example_01.yml"
  workflow_dispatch:

jobs:
  solution-and-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check verifier rejection cases
        run: |
          python task/task_example_01/tests/test_adversarial.py
          python -O task/task_example_01/tests/test_adversarial.py
      - name: Build scientific image
        run: docker build -t mmb-example01-environment task/task_example_01/environment
      - name: Recompute answer from released force constants
        run: |
          docker run --rm \
            -v "$PWD/task/task_example_01/solution:/solution:ro" \
            mmb-example01-environment bash /solution/solve.sh
      - name: Check Harbor-compatible staging task
        run: |
          python scripts/build_harbor_task.py \
            --source task/task_example_01 \
            --output "$RUNNER_TEMP/mmb-example01-harbor"
          uvx harbor==0.25.0 lint "$RUNNER_TEMP/mmb-example01-harbor"
      - name: Run oracle and isolated verifier in Harbor
        run: |
          python scripts/build_harbor_task.py \
            --source task/task_example_01 \
            --output "$RUNNER_TEMP/mmb-example01-answer-harbor"
          uvx harbor==0.25.0 run \
            --path "$RUNNER_TEMP/mmb-example01-answer-harbor" \
            --agent oracle \
            --env docker \
            --override-cpus 4 \
            --override-memory-mb 14000 \
            --jobs-dir "$RUNNER_TEMP/mmb-example01-jobs" \
            --job-name example01-answer
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job = Path(os.environ["RUNNER_TEMP"]) / "mmb-example01-jobs" / "example01-answer"
          trials = [path for path in job.rglob("result.json") if path.parent != job]
          assert len(trials) == 1, trials
          result = json.loads(trials[0].read_text(encoding="utf-8"))
          reward = (result.get("verifier_result") or {}).get("rewards", {}).get("reward")
          print(f"Oracle reward: {reward}")
          assert reward == 1.0, result
          PY
