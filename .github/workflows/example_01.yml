name: Validate example_01 engineering pilot

on:
  push:
    paths:
      - "task/task_example_01/**"
      - ".github/workflows/example_01.yml"
  workflow_dispatch:

jobs:
  solution-and-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check five-expert simulated record protocol
        run: python task/task_example_01/authoring/provenance/validate_sample_records.py
      - name: Check source archives independently of the oracle
        run: python task/task_example_01/authoring/provenance/validate_sources.py
      - name: Check scientific signal in the agent image
        run: |
          docker build -t mmb-example01-environment task/task_example_01/environment
          docker run --rm \
            -v "$PWD/task/task_example_01/solution:/solution:ro" \
            mmb-example01-environment bash /solution/check_sources.sh
      - name: Recompute scientific witness
        run: |
          docker run --rm \
            -v "$PWD/task/task_example_01/solution:/solution:ro" \
            -v "$PWD/task/task_example_01/authoring/evidence:/evidence:ro" \
            mmb-example01-environment python /evidence/check_witness.py
      - name: Check objective verifier against wrong answers
        run: python task/task_example_01/authoring/evidence/check_verifier.py
      - name: Check Harbor-compatible staging task
        run: |
          python task/task_example_01/authoring/provenance/build_harbor_task.py --output "$RUNNER_TEMP/mmb-example01-harbor"
          uvx harbor==0.25.0 lint "$RUNNER_TEMP/mmb-example01-harbor"
      - name: Run the engineering-pilot oracle and verifier
        run: |
          python task/task_example_01/authoring/provenance/build_harbor_task.py --output "$RUNNER_TEMP/mmb-example01-answer-harbor"
          uvx harbor==0.25.0 run \
            --path "$RUNNER_TEMP/mmb-example01-answer-harbor" \
            --agent oracle \
            --env docker \
            --override-cpus 4 \
            --override-memory-mb 14000 \
            --jobs-dir "$RUNNER_TEMP/mmb-example01-jobs" \
            --job-name example01-answer
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job = Path(os.environ["RUNNER_TEMP"]) / "mmb-example01-jobs" / "example01-answer"
          trials = [path for path in job.rglob("result.json") if path.parent != job]
          assert len(trials) == 1, trials
          result = json.loads(trials[0].read_text(encoding="utf-8"))
          reward = result.get("verifier_result", {}).get("rewards", {}).get("reward")
          assessments = list(trials[0].parent.rglob("assessment.json"))
          assert len(assessments) == 1, assessments
          assessment = json.loads(assessments[0].read_text(encoding="utf-8"))
          print(f"Oracle reward: {reward}; assessment: {assessment['status']}")
          assert reward == 1.0 and assessment["status"] == "correct", result
          PY
