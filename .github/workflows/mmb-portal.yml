name: MMB Portal
on:
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/mmb-portal.yml'
  push:
    branches:
      - 'feature/mmb-v2-admission'
    paths:
      - 'portal/**'
      - '.github/workflows/mmb-portal.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mmb
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mmb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r portal/requirements.txt
      - name: Workflow integration
        working-directory: portal
        env:
          MMB_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://mmb:test-only@localhost:5432/mmb' || '' }}
        run: python -m unittest discover -s tests -v
