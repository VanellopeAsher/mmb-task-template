<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MatterMysteryBench{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
<script src="{{ url_for('static', filename='portal.js') }}" defer></script>
<meta name="csrf-token" content="{{ csrf }}">
</head>
<body>
<header class="masthead"><div class="shell mast-inner">
<a class="brand" href="{{ url_for('dashboard') }}"><span class="mark"><i></i><i></i><i></i><i></i></span>MatterMysteryBench</a>
{% if actor %}<nav aria-label="Account"><span>{{ actor.id }} · {{ actor.role | title }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet">Sign out</button></form></nav>{% endif %}
</div></header>
<main class="shell">{% block content %}{% endblock %}</main>
</body></html>
